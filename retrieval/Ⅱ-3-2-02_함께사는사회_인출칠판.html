DATA.sections.forEach(s => s.items.forEach(x => { x.ans = x.a.map(parseA); }));
function parseA(s){ const k = s.indexOf("|"); return k < 0 ? {l:"", t:s} : {l:s.slice(0, k), t:s.slice(k + 1)}; }
(function(){ let g = 0; DATA.sections.forEach((s, si) => s.items.forEach(x => { x.gid = g++; x.si = si; })); })();

/* ── 설정 ── */
const OPTS = [
  {key:"range",   label:"문항 수",       choices:[[1,"핵심"],[2,"표준"],[3,"전체"]]},
  {key:"stemSec", label:"문제 노출 시간 (복수 답은 자동으로 더 줌)", choices:[[5,"5초"],[7,"7초"],[10,"10초"],["auto","문장 길이에 맞춤"]]},
  {key:"reveal",  label:"정답 공개",     choices:[["auto","시간이 되면 자동"],["click","눌러서 보기"]]},
  {key:"hide",    label:"정답 표시",     choices:[[0,"보이기"],[1,"가리기 (눌러서 열기)"]]},
  {key:"advance", label:"다음 문항으로", choices:[["auto","자동으로 넘김"],["click","눌러서 넘김"]]},
  {key:"note",    label:"정답 아래 관련 개념어·쪽수", choices:[[1,"보이기"],[0,"숨기기"]]},
  {key:"inter",   label:"구간이 끝났을 때", choices:[["show","사슬 요약을 보여 주고 이어 감"],["hold","사슬 요약에서 멈춤"],["skip","바로 다음 구간"]]}
];
const RANGE_NAME = {1:"핵심", 2:"표준", 3:"전체"};
const PRESETS = {
  class:{range:1, stemSec:7, reveal:"auto",  hide:0, advance:"auto",  note:0, inter:"skip"},
  self: {range:3, stemSec:"auto", reveal:"click", hide:0, advance:"click", note:1, inter:"hold"}
};
const KEY = "recallBoard.II3202.v1";
const cfg = Object.assign({}, PRESETS.class);
function loadCfg(){
  try {
    const j = JSON.parse(localStorage.getItem(KEY) || "null");
    if (j && j.cfg) OPTS.forEach(o => { if (o.choices.some(c => c[0] === j.cfg[o.key])) cfg[o.key] = j.cfg[o.key]; });
  } catch (e) {}
}
function saveCfg(){ try { localStorage.setItem(KEY, JSON.stringify({cfg})); } catch (e) {} }

/* ── 준비 ── */
const BETWEEN = 5600;
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
const plainLen = s => s.replace(/\[\[|\]\]/g, "").length;

/* 고른 문항 수에 맞춰 문항 목록을 만든다 */
function makeQ(range){
  const Qn = [], st = [], ln = [], seen = new Set();
  DATA.sections.forEach((s, si) => {
    const vis = s.items.filter(x => x.lv <= range);
    st.push(Qn.length); ln.push(vis.length);
    vis.forEach((x, ii) => {
      Qn.push({si, ii, gid:x.gid, q:x.q, len:plainLen(x.q), ans:x.ans, note:x.note, ref:x.ref, seen:new Set(seen)});
      x.ans.forEach(a => seen.add(a.t));
    });
  });
  return {Q:Qn, secStart:st, secLen:ln};
}
const Q = [], secStart = [], secLen = [];
let builtRange = 0;
function build(){
  const m = makeQ(cfg.range);
  Q.length = 0; secStart.length = 0; secLen.length = 0;
  m.Q.forEach(q => Q.push(q)); m.secStart.forEach(v => secStart.push(v)); m.secLen.forEach(v => secLen.push(v));
  builtRange = cfg.range;
}
const secItems = si => Q.filter(q => q.si === si);
const fmtStem = q => esc(q.q).replace(/\[\[(.+?)\]\]/g, (m, x) => q.seen.has(x) ? '<span class="prev">' + x + '</span>' : x);
const ansJoin = q => q.ans.map(a => a.t).join(" · ");
function cueOf(q){
  if (q.ans.length < 2) return "";
  let s = "답 " + q.ans.length + "개";
  const m = new Map();
  q.ans.forEach(a => { if (a.l) m.set(a.l, (m.get(a.l) || 0) + 1); });
  if (m.size) s += " · " + [...m].map(([k, v]) => v > 1 ? k + " " + v : k).join(" · ");
  return s;
}

/* 노출·정답 시간 (복수 답은 답 하나당 시간을 더 준다) */
const secFor = q => Math.max(7, Math.min(11, Math.round(5 + q.len / 18)));
const multiBonus = q => q.ans.length > 1 ? Math.min(4.5, (q.ans.length - 1) * 1.5) * 1000 : 0;
const stemDur = (q, c = cfg) => (c.stemSec === "auto" ? secFor(q) : c.stemSec) * 1000 + multiBonus(q);
const holdBase = (q, c = cfg) => (c.note ? 3000 : 2200) + (q.ans.length > 1 ? (q.ans.length - 1) * 700 : 0);
const ansHold = () => masked() ? 2000 : holdBase(Q[state.qi]);

const state = {mode:"start", qi:0, si:0, elapsed:0, dur:0, paused:false, opened:false, done:new Set()};
const masked = () => !!cfg.hide && !state.opened;
function paintAnswer(){ document.body.classList.toggle("masked", state.mode === "answer" && masked()); }
function setMode(m){ state.mode = m; document.body.dataset.mode = m; }

/* 예상 시간: 자동 진행일 때만 계산한다 */
function estimate(range, c = cfg){
  if (c.reveal === "click" || c.advance === "click") return null;
  const m = makeQ(range); let ms = 0;
  m.Q.forEach(q => { ms += stemDur(q, c) + holdBase(q, c); });
  if (c.inter === "show") ms += BETWEEN * (DATA.sections.length - 1);
  return ms;
}
function fmtTime(ms){
  const s = Math.round(ms / 1000), m = Math.floor(s / 60), r = s % 60;
  return m ? (r ? m + "분 " + r + "초" : m + "분") : r + "초";
}
const countAt = r => makeQ(r).Q.length;

/* ── 아래 사슬 네비게이션 ── */
function buildChain(){
  const c = $("#chain"); c.innerHTML = "";
  DATA.sections.forEach((s, si) => {
    const g = document.createElement("div"); g.className = "grp"; g.dataset.si = si;
    const lb = document.createElement("button"); lb.className = "glabel"; lb.textContent = s.short;
    lb.onclick = () => { goto(secStart[si]); blurBtn(); };
    const ds = document.createElement("div"); ds.className = "dots";
    Q.forEach((q, i) => {
      if (q.si !== si) return;
      const b = document.createElement("button"); b.className = "dot" + (q.ans.length > 1 ? " multi" : "");
      b.setAttribute("aria-label", s.short + " " + (q.ii + 1));
      b.onclick = () => { goto(i); blurBtn(); };
      ds.appendChild(b);
    });
    g.append(lb, ds); c.appendChild(g);
  });
}
function paintChain(){
  const live = state.mode === "stem" || state.mode === "answer";
  document.querySelectorAll(".dot").forEach((d, i) => {
    d.classList.toggle("done", state.done.has(i));
    d.classList.toggle("cur", live && i === state.qi);
  });
  const cs = Q[state.qi] ? Q[state.qi].si : 0;
  document.querySelectorAll(".grp").forEach(g => g.classList.toggle("cur", +g.dataset.si === cs));
}

/* 눌러서 진행할 때 나타나는 버튼 */
function paintCue(){
  let t = "";
  if (state.mode === "stem" && cfg.reveal === "click") t = cfg.hide ? "넘어가기 ▶" : "정답 보기 ▶";
  else if (state.mode === "answer" && cfg.advance === "click") t = "다음 ▶";
  else if (state.mode === "between" && cfg.inter === "hold") t = "다음 구간 ▶";
  const c = $("#cue"); c.textContent = t; c.style.display = t ? "block" : "none";
}
function waiting(){
  return (state.mode === "stem" && cfg.reveal === "click" && state.dur === Infinity) ||
         (state.mode === "answer" && cfg.advance === "click") ||
         (state.mode === "between" && cfg.inter === "hold");
}

/* ── 화면 전환 ── */
function hideOverlays(){ ["#start", "#finale"].forEach(s => $(s).classList.remove("on")); $("#inter").classList.remove("on"); }
function showQuestion(i){
  hideOverlays();
  state.qi = i; state.si = Q[i].si;
  const q = Q[i];
  setMode("stem"); state.elapsed = 0; state.dur = stemDur(q);
  state.opened = false; /* 가림 상태는 정답 칸이 사라질 때까지 그대로 둔다(페이드 중 노출 방지) */
  $("#stem").innerHTML = fmtStem(q);
  const cue = cueOf(q); $("#cnt").textContent = cue; $("#cnt").style.visibility = cue ? "visible" : "hidden";
  $("#secTitle").innerHTML = "<b>" + esc(DATA.sections[q.si].title) + "</b>";
  $("#ans").classList.remove("on");
  $("#timer").style.opacity = 1; $("#timerBar").style.transform = "scaleX(1)";
  paintChain(); paintCue();
}
function paintAnsText(q){
  const el = $("#ansText");
  if (q.ans.length === 1 && !q.ans[0].l) { el.className = "single"; el.textContent = q.ans[0].t; return; }
  el.className = "multi";
  el.innerHTML = '<div class="alist">' + q.ans.map((a, k) =>
    '<div class="aitem" style="animation-delay:' + (k * .35) + 's">' +
    (a.l ? '<span class="al">' + esc(a.l) + '</span>' : '') + '<span class="at">' + esc(a.t) + '</span></div>').join("") + '</div>';
}
function showAnswer(){
  const q = Q[state.qi];
  setMode("answer"); state.elapsed = 0; state.opened = false; state.done.add(state.qi);
  state.dur = cfg.advance === "click" ? Infinity : ansHold();
  paintAnsText(q); $("#ansNote").textContent = q.note || ""; $("#ansRef").textContent = q.ref || "";
  $("#ans").classList.add("on"); $("#timer").style.opacity = 0;
  paintAnswer(); paintChain(); paintCue();
}
/* 가려 둔 정답을 연다. 열린 뒤에는 보이는 시간을 처음부터 다시 줍니다. */
function openAnswer(){
  if (state.mode !== "answer" || !masked()) return;
  state.opened = true; paintAnswer();
  state.elapsed = 0; state.dur = cfg.advance === "click" ? Infinity : ansHold();
}
function afterAnswer(){
  const q = Q[state.qi];
  if (state.qi === Q.length - 1) return showFinale();
  if (q.ii === secLen[q.si] - 1) return cfg.inter === "skip" ? showQuestion(state.qi + 1) : showInterlude(q.si);
  showQuestion(state.qi + 1);
}
const chipHtml = (q, cls) => '<span class="' + cls + (q.ans.length > 1 ? ' m' : '') + '">' + esc(ansJoin(q)) + '</span>';
function showInterlude(si){
  setMode("between"); state.si = si; state.elapsed = 0; state.dur = cfg.inter === "hold" ? Infinity : BETWEEN;
  const s = DATA.sections[si], nx = DATA.sections[si + 1];
  $("#inter").innerHTML =
    '<div class="itag">' + esc(s.title) + ' — 이어진 사슬</div>' +
    '<div class="ichips">' + secItems(si).map((q, k) =>
      '<span class="ipair' + (q.ans.length > 1 ? ' m' : '') + '">' +
      (k ? '<span class="iarr" style="animation-delay:' + (k * .4 - .2) + 's">→</span>' : '') +
      '<span class="ichip' + (q.ans.length > 1 ? ' m' : '') + '" style="animation-delay:' + (k * .4) + 's">' + esc(ansJoin(q)) + '</span></span>').join("") + '</div>' +
    '<div class="inext">다음 · ' + esc(nx.title) + '</div>';
  $("#inter").classList.add("on"); paintChain(); paintCue();
}
function showFinale(){
  setMode("finale");
  $("#rows").innerHTML = DATA.sections.map((s, si) =>
    '<div class="row"><div class="rlabel">' + esc(s.short) + '</div><div class="chips">' +
    secItems(si).map((q, k) => '<span class="fpair">' + (k ? '<span class="arrow"><em>왜?</em>→</span>' : '') + chipHtml(q, "chip") + '</span>').join("") +
    '</div></div>').join("");
  $("#rows").classList.toggle("dense", Q.length > 36);
  $("#finale").classList.add("on"); paintChain(); paintCue();
}
function goto(i){ state.paused = false; document.body.classList.remove("paused"); $("#bPause").textContent = "일시정지"; showQuestion(i); }
function begin(){ state.done.clear(); goto(0); }
function goNextSection(){ showQuestion(secStart[state.si + 1]); }

function step(){
  switch (state.mode) {
    case "start": begin(); break;
    case "stem": showAnswer(); break;
    case "answer": afterAnswer(); break;
    case "between": goNextSection(); break;
  }
}
function prev(){
  if (state.mode === "start") return;
  if (state.mode === "between") return goto(secStart[state.si] + secLen[state.si] - 1);
  if (state.mode === "finale") return goto(Q.length - 1);
  goto(Math.max(0, state.qi - 1));
}
function togglePause(){
  if (state.mode === "start" || state.mode === "finale") return;
  state.paused = !state.paused; document.body.classList.toggle("paused", state.paused);
  $("#bPause").textContent = state.paused ? "계속" : "일시정지";
}
function fullscreen(){
  try { (document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen()).catch(() => {}); } catch (e) {}
}
function blurBtn(){ if (document.activeElement && document.activeElement.blur) document.activeElement.blur(); }

/* 문항 수를 바꾸면 지금 보던 자리에서 이어 간다 */
function reflow(){
  const live = state.mode === "stem" || state.mode === "answer";
  const cur = live && Q[state.qi] ? Q[state.qi].gid : null;
  const doneG = new Set([...state.done].map(i => Q[i] && Q[i].gid));
  build(); buildChain();
  state.done = new Set(); Q.forEach((q, i) => { if (doneG.has(q.gid)) state.done.add(i); });
  if (state.mode === "start") { state.qi = 0; paintChain(); paintStartButtons(); return; }
  if (live) {
    let i = Q.findIndex(q => q.gid >= cur); if (i < 0) i = Q.length - 1;
    const wasAnswer = state.mode === "answer";
    showQuestion(i);
    if (wasAnswer && Q[i].gid === cur) showAnswer();
  } else if (state.mode === "between") {
    showQuestion(Math.min(secStart[Math.min(state.si + 1, secStart.length - 1)], Q.length - 1));
  } else if (state.mode === "finale") showFinale();
  paintStartButtons();
}

/* ── 설정 패널 ── */
function buildPanel(){
  $("#pBody").innerHTML = OPTS.map(o =>
    '<div class="pgrp"><div class="plabel">' + esc(o.label) + '</div><div class="seg" data-key="' + o.key + '">' +
    o.choices.map(c => '<button type="button" data-v="' + c[0] + '">' + esc(c[1]) + '</button>').join("") +
    '</div></div>').join("");
  document.querySelectorAll(".seg").forEach(seg => {
    seg.addEventListener("click", e => {
      const b = e.target.closest("button"); if (!b) return;
      const o = OPTS.find(x => x.key === seg.dataset.key);
      const ch = o.choices.find(c => String(c[0]) === b.dataset.v);
      cfg[o.key] = ch[0]; applyCfg(); blurBtn();
    });
  });
}
const same = (a, b) => OPTS.every(o => a[o.key] === b[o.key]);
function paintSettings(){
  OPTS.forEach(o => {
    document.querySelectorAll('.seg[data-key="' + o.key + '"] button').forEach(b =>
      b.setAttribute("aria-pressed", String(b.dataset.v) === String(cfg[o.key])));
  });
  document.querySelectorAll('.seg[data-key="range"] button').forEach(b => {
    const r = +b.dataset.v, t = estimate(r);
    b.innerHTML = RANGE_NAME[r] + ' <small>' + countAt(r) + '문항' + (t == null ? '' : ' · 약 ' + fmtTime(t)) + '</small>';
  });
  $("#pClass").setAttribute("aria-pressed", same(cfg, PRESETS.class));
  $("#pSelf").setAttribute("aria-pressed", same(cfg, PRESETS.self));
  document.body.classList.toggle("nonote", !cfg.note);
}
function paintStartButtons(){
  const ct = estimate(PRESETS.class.range, PRESETS.class);
  $("#bStartClass small").textContent = RANGE_NAME[PRESETS.class.range] + " " + countAt(PRESETS.class.range) + "문항" + (ct == null ? "" : " · 약 " + fmtTime(ct)) + " · 자동 진행";
  $("#bStartSelf small").textContent = RANGE_NAME[PRESETS.self.range] + " " + countAt(PRESETS.self.range) + "문항 · 내 속도로";
}
function applyCfg(){
  saveCfg();
  if (builtRange !== cfg.range) reflow();
  paintSettings();
  /* 진행 중인 화면에도 바로 반영 */
  if (state.mode === "stem") {
    if (cfg.reveal === "click" && state.dur === Infinity) { /* 이미 기다리는 중 */ }
    else state.dur = Math.max(state.elapsed + 300, stemDur(Q[state.qi]));
  } else if (state.mode === "answer") {
    paintAnswer();
    state.dur = cfg.advance === "click" ? Infinity : Math.max(state.elapsed + 300, ansHold());
  } else if (state.mode === "between") {
    if (cfg.inter === "skip") return goNextSection();
    state.dur = cfg.inter === "hold" ? Infinity : Math.max(state.elapsed + 300, BETWEEN);
  }
  paintCue();
}
function usePreset(name){ Object.assign(cfg, PRESETS[name]); applyCfg(); }
function openPanel(on){
  const p = $("#panel"); p.classList.toggle("on", on); p.setAttribute("aria-hidden", String(!on));
}

/* ── 시간 ── */
let last = 0;
function tick(t){
  const dt = Math.min(120, t - (last || t)); last = t;
  if (!state.paused && (state.mode === "stem" || state.mode === "answer" || state.mode === "between")) {
    state.elapsed += dt;
    if (state.mode === "stem" && state.dur !== Infinity) {
      const r = Math.max(0, 1 - state.elapsed / state.dur);
      const bar = $("#timerBar"); bar.style.transform = "scaleX(" + r + ")";
      bar.style.background = r < .28 ? "var(--acc)" : "var(--link)";
    }
    if (state.elapsed >= state.dur) {
      if (state.mode === "stem") {
        if (cfg.reveal === "auto") showAnswer();
        else { state.dur = Infinity; $("#timerBar").style.transform = "scaleX(0)"; paintCue(); }
      }
      else if (state.mode === "answer") afterAnswer();
      else goNextSection();
    }
  }
  requestAnimationFrame(tick);
}

/* ── 조작 ── */
$("#bStartClass").onclick = () => { usePreset("class"); begin(); blurBtn(); };
$("#bStartSelf").onclick = () => { usePreset("self"); begin(); blurBtn(); };
$("#bStartSet").onclick = () => { openPanel(true); blurBtn(); };
$("#bRestart").onclick = () => { begin(); blurBtn(); };
$("#bPrev").onclick = () => { prev(); blurBtn(); };
$("#bStep").onclick = () => { step(); blurBtn(); };
$("#bPause").onclick = () => { togglePause(); blurBtn(); };
$("#pClass").onclick = () => { usePreset("class"); blurBtn(); };
$("#pSelf").onclick = () => { usePreset("self"); blurBtn(); };
$("#bGear").onclick = () => { openPanel(!$("#panel").classList.contains("on")); blurBtn(); };
$("#pClose").onclick = () => { openPanel(false); blurBtn(); };
$("#bFs").onclick = () => { fullscreen(); blurBtn(); };
$("#cue").onclick = () => { step(); blurBtn(); };
$("#ansMask").onclick = () => { openAnswer(); blurBtn(); };

addEventListener("keydown", e => {
  if (e.target && e.target.closest && e.target.closest("a")) return;
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  const k = e.key;
  if (k === "Escape") { openPanel(false); return; }
  if (k === " ") { e.preventDefault(); if (state.mode === "start") begin(); else if (waiting()) step(); else togglePause(); }
  else if (k === "ArrowRight" || k === "Enter") { e.preventDefault(); step(); }
  else if (k === "ArrowLeft") { e.preventDefault(); prev(); }
  else if (k === "a" || k === "A") openAnswer();
  else if (k === "f" || k === "F") fullscreen();
  else if (/^[1-9]$/.test(k) && +k <= DATA.sections.length) goto(secStart[+k - 1]);
  else if (k === "Home") begin();
});

loadCfg(); build(); buildChain(); buildPanel(); paintChain(); paintSettings(); paintStartButtons(); paintCue();
requestAnimationFrame(tick);

/* 점검용 */
window.__BOARD = {Q, DATA, state, cfg, step, prev, goto, usePreset, applyCfg, estimate, makeQ};
})();
</script>
</body>
</html>
