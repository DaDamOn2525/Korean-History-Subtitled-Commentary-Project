<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>한국사 자막 해설 프로젝트 | 전체 목차</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;500;600;700;900&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#EFE9DA; --paper-card:#FBF8F0; --ink:#20242B; --ink-soft:#4A4F58;
    --indigo:#2B3A55; --indigo-soft:#DCE3EC;
    --brass:#93701F; --brass-soft:#EDE1C2;
    --line:#D3C9AE; --line-strong:#B8AB88;
  }
  *{box-sizing:border-box;}
  body{ margin:0; background:var(--paper);
    background-image: radial-gradient(circle at 10% 5%, rgba(147,112,31,0.05), transparent 40%), radial-gradient(circle at 90% 15%, rgba(43,58,85,0.05), transparent 40%);
    color:var(--ink); font-family:'Noto Sans KR', sans-serif; line-height:1.65; }
  h1,h2{ font-family:'Noto Serif KR', serif; margin:0; color:var(--ink); }
  .hero{ padding:64px 24px 44px; border-bottom:1px solid var(--line-strong); margin-bottom:40px; }
  .hero-inner{max-width:820px; margin:0 auto;}
  .kicker{ font-size:14px; color:var(--ink-soft); margin-bottom:14px; }
  .kicker span{color:var(--brass); font-weight:700;}
  .hero h1{ font-size:clamp(28px,4.5vw,42px); font-weight:700; line-height:1.3; }
  .hero p{ margin-top:14px; font-size:15.5px; color:var(--ink-soft); max-width:600px; }
  .wrap{max-width:820px; margin:0 auto; padding:0 24px 80px;}
  .unit-list{list-style:none; margin:0; padding:0; display:grid; gap:14px;}
  .unit-list a{ display:block;
    background:var(--paper-card); border:1px solid var(--line-strong); border-radius:8px;
    padding:20px 22px; text-decoration:none; color:var(--ink); transition:border-color .15s, background .15s; }
  .unit-list a:hover{ border-color:var(--brass); background:#fff; }
  .unit-title{font-size:17px; font-weight:700; font-family:'Noto Serif KR', serif;}
  .unit-desc{font-size:13.5px; color:var(--ink-soft); margin-top:6px;}
  .unit-list .disabled{
    background:transparent; border:1px dashed var(--line-strong); color:var(--ink-soft);
    padding:20px 22px; border-radius:8px; font-size:14px; }
  footer{ max-width:820px; margin:0 auto; padding:24px; font-size:12.5px; color:var(--ink-soft); border-top:1px solid var(--line-strong); }
</style>
</head>
<body>

<header class="hero">
  <div class="hero-inner">
    <div class="kicker"><span>한국사 자기주도학습</span> · 자막 해설 프로젝트</div>
    <h1>한국사 요약도표 — 전체 목차</h1>
    <p>대단원별로 정리된 자막 해설 포함 요약도표입니다. 각 대단원을 누르면 소단원 목차로 이동합니다.</p>
  </div>
</header>

<div class="wrap">
  <ul class="unit-list">
    <li>
      <a href="한국사2_1단원(해설자막포함)/index.html">
        <div class="unit-title">Ⅱ-1. 일제의 식민 통치와 민족 운동의 전개</div>
        <div class="unit-desc">제1차 세계 대전(1914) ~ 광복(1945) · 17개 소주제</div>
      </a>
    </li>
    <li>
      <div class="disabled">다음 대단원은 추가되는 대로 이 목록에 이어집니다.</div>
    </li>
  </ul>
</div>

<footer>
  한국사 자막 해설 프로젝트
</footer>

</body>
</html>
